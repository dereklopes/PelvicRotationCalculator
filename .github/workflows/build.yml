name: Build and Package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  JAVAFX_VERSION: "21.0.2"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux
            fx-platform: linux-x64
          - os: windows-latest
            artifact-name: windows
            fx-platform: windows-x64
          - os: macos-latest
            artifact-name: macos
            fx-platform: osx-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package --no-transfer-progress

      - name: Download OpenJFX jmods
        shell: bash
        run: |
          curl -fL -o javafx-jmods.zip \
            "https://download2.gluonhq.com/openjfx/${{ env.JAVAFX_VERSION }}/openjfx-${{ env.JAVAFX_VERSION }}_${{ matrix.fx-platform }}_bin-jmods.zip"
          unzip -q javafx-jmods.zip

      - name: Package with jpackage (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --type app-image \
            --name PelvicRotationCalculator \
            --app-version 1.0.0 \
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar:javafx-jmods-${{ env.JAVAFX_VERSION }}" \
            --module Calculator/Calculator.CalculatorApplication \
            --dest target/dist

      - name: Package with jpackage (macOS)
        if: runner.os == 'macOS'
        run: |
          jpackage \
            --type dmg \
            --name PelvicRotationCalculator \
            --app-version 1.0.0 \
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar:javafx-jmods-${{ env.JAVAFX_VERSION }}" \
            --module Calculator/Calculator.CalculatorApplication \
            --dest target/dist

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --type app-image `
            --name PelvicRotationCalculator `
            --app-version 1.0.0 `
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar;javafx-jmods-${{ env.JAVAFX_VERSION }}" `
            --module Calculator/Calculator.CalculatorApplication `
            --dest target/dist

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: PelvicRotationCalculator-${{ matrix.artifact-name }}
          path: target/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Create release archives
        run: |
          for dir in artifacts/PelvicRotationCalculator-*/; do
            name=$(basename "$dir")
            dmg=$(find "$dir" -name "*.dmg" -print -quit)
            if [ -n "$dmg" ]; then
              cp "$dmg" "${name}-${{ github.ref_name }}.dmg"
            else
              (cd "$dir" && zip -r "../../${name}-${{ github.ref_name }}.zip" .)
            fi
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.dmg
          generate_release_notes: true
