name: Build and Package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package --no-transfer-progress

      - name: Package with jpackage (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          jpackage \
            --type app-image \
            --name PelvicRotationCalculator \
            --app-version 1.0.0 \
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar:target/lib" \
            --module Calculator/Calculator.CalculatorApplication \
            --dest target/dist

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --type app-image `
            --name PelvicRotationCalculator `
            --app-version 1.0.0 `
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar;target/lib" `
            --module Calculator/Calculator.CalculatorApplication `
            --dest target/dist

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: PelvicRotationCalculator-${{ matrix.os }}
          path: target/dist/
          if-no-files-found: error
