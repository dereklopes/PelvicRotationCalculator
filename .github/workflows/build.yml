name: Build and Package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux
          - os: windows-latest
            artifact-name: windows
          - os: macos-latest
            artifact-name: macos
          - os: macos-13
            artifact-name: macos-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanitize ref name for filename
        id: ver
        shell: bash
        run: |
          value="${{ github.ref_name }}"
          echo "value=${value//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package --no-transfer-progress

      - name: Package with jpackage (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          jpackage \
            --type app-image \
            --name PelvicRotationCalculator \
            --app-version 1.0.0 \
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar:target/lib" \
            --module Calculator/Calculator.CalculatorApplication \
            --dest target/dist

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --type app-image `
            --name PelvicRotationCalculator `
            --app-version 1.0.0 `
            --module-path "target/pelvic-rotation-calculator-1.0.0.jar;target/lib" `
            --module Calculator/Calculator.CalculatorApplication `
            --dest target/dist

      - name: Archive artifact (Linux and macOS)
        if: runner.os != 'Windows'
        run: zip -r target/PelvicRotationCalculator-${{ matrix.artifact-name }}-${{ steps.ver.outputs.value }}.zip target/dist/

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/dist/* -DestinationPath target/PelvicRotationCalculator-${{ matrix.artifact-name }}-${{ steps.ver.outputs.value }}.zip

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: PelvicRotationCalculator-${{ matrix.artifact-name }}
          path: target/PelvicRotationCalculator-${{ matrix.artifact-name }}-${{ steps.ver.outputs.value }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
